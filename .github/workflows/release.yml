name: Release

# Triggered when a `v*` tag is pushed (e.g. `v0.2.0`). The in-app updater
# parses tag_name through `parse_tag_version` and downloads assets:
#   - update.tar.gz            bundle: bin/kindle-hello + assets/* + chess_app.sh + MANIFEST.sha256
#   - update.tar.gz.sha256     sha256sum-format sidecar for the bundle
#   - kindle-chess-armv7-musl{,.sha256}   legacy binary-only pair (kept during
#                              transition so 0.4.0 clients can still update)
# The bundle names are the contract with crate/src/api/github.rs — keep in sync.

on:
  push:
    tags:
      - 'v*'
  # Allow manual runs from the Actions tab (handy for re-uploading assets).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build a release for'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      ASSET_NAME: kindle-chess-armv7-musl
      BUNDLE_NAME: update.tar.gz
      TARGET: armv7-unknown-linux-musleabi

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          # Full history so build.rs can resolve a real git short SHA.
          fetch-depth: 0

      - name: Sanity-check tag matches Cargo.toml version
        working-directory: crate
        run: |
          TAG_VERSION="${{ steps.tag.outputs.name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          MANIFEST_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "tag=$TAG_VERSION  manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag $TAG_VERSION does not match Cargo.toml version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Cross-compile (armv7-musl, release)
        working-directory: crate
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" \
            cross build --target "$TARGET" --release

      - name: Stage release assets
        run: |
          mkdir -p dist
          # Legacy binary-only pair (kept during transition for 0.4.0 clients)
          cp "crate/target/${TARGET}/release/kindle-hello" "dist/${ASSET_NAME}"
          (cd dist && sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256")
          # Update bundle: binary + assets + launcher + per-file manifest
          mkdir -p dist/bundle/bin dist/bundle/assets
          cp "crate/target/${TARGET}/release/kindle-hello" dist/bundle/bin/
          cp kindlichess/assets/* dist/bundle/assets/
          cp kindlichess/chess_app.sh dist/bundle/
          (cd dist/bundle && find . -type f ! -name MANIFEST.sha256 | sort | xargs sha256sum > MANIFEST.sha256)
          tar -czf "dist/${BUNDLE_NAME}" -C dist/bundle .
          (cd dist && sha256sum "${BUNDLE_NAME}" > "${BUNDLE_NAME}.sha256")
          rm -rf dist/bundle
          ls -la dist

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          # Create the release if it doesn't exist; upload (and overwrite) all
          # assets either way.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" \
            "dist/${ASSET_NAME}" \
            "dist/${ASSET_NAME}.sha256" \
            "dist/${BUNDLE_NAME}" \
            "dist/${BUNDLE_NAME}.sha256" \
            --clobber
