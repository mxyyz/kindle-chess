name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests run natively on the runner, not under `cross`. Everything under
  # test (models/bitboard.rs, models/puzzle.rs) is pure logic — no X11, no
  # network, no assets — so the host target is enough and the job stays fast.
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Format check
      working-directory: crate
      run: cargo fmt --check
    - name: Clippy
      working-directory: crate
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      working-directory: crate
      run: cargo test --verbose

  # Coverage report only — never gates on a percentage (report-only per scope).
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Generate coverage (lcov + html)
      working-directory: crate
      run: |
        cargo llvm-cov --lcov --output-path lcov.info
        cargo llvm-cov --html
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: crate/target/llvm-cov/html
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: crate/lcov.info

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cd ./crate && cargo install cross --git https://github.com/cross-rs/cross && RUSTFLAGS="-C target-feature=+crt-static" cross build --target armv7-unknown-linux-musleabi --release

  # Bundle dry-run: proves the update.tar.gz contract on every PR — the same
  # commands release.yml runs, minus the gh upload. Fails the PR if the
  # bundle can't be built, extracted, and MANIFEST-verified.
  bundle-dry-run:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build release binary
      working-directory: crate
      run: cargo build --release
    - name: Stage + verify bundle
      run: |
        set -e
        tmp=$(mktemp -d)
        mkdir -p "$tmp/bundle/bin" "$tmp/bundle/assets"
        cp crate/target/release/kindle-hello "$tmp/bundle/bin/"
        cp kindlichess/assets/* "$tmp/bundle/assets/"
        cp kindlichess/chess_app.sh "$tmp/bundle/"
        (cd "$tmp/bundle" && find . -type f ! -name MANIFEST.sha256 | sort | xargs sha256sum > MANIFEST.sha256)
        tar -czf "$tmp/update.tar.gz" -C "$tmp/bundle" .
        (cd "$tmp" && sha256sum update.tar.gz > update.tar.gz.sha256)
        mkdir "$tmp/x" && tar -xzf "$tmp/update.tar.gz" -C "$tmp/x"
        (cd "$tmp/x" && sha256sum -c MANIFEST.sha256)
        echo "Bundle dry-run OK: $(ls -la "$tmp/update.tar.gz" | awk '{print $5}') bytes"
        rm -rf "$tmp"
