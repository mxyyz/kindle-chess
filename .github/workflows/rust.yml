name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests run natively on the runner, not under `cross`. Everything under
  # test (models/bitboard.rs, models/puzzle.rs) is pure logic — no X11, no
  # network, no assets — so the host target is enough and the job stays fast.
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Format check
      working-directory: kindle_chess
      run: cargo fmt --check
    - name: Clippy
      working-directory: kindle_chess
      run: cargo clippy --all-targets -- -D warnings
    - name: Test
      working-directory: kindle_chess
      run: cargo test --verbose

  # Coverage report only — never gates on a percentage (report-only per scope).
  coverage:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - name: Generate coverage (lcov + html)
      working-directory: kindle_chess
      run: cargo llvm-cov --lcov --output-path lcov.info --html
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: kindle_chess/target/llvm-cov/html
    - uses: actions/upload-artifact@v4
      with:
        name: coverage-lcov
        path: kindle_chess/lcov.info

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cd ./kindle_chess && cargo install cross --git https://github.com/cross-rs/cross && RUSTFLAGS="-C target-feature=+crt-static" cross build --target armv7-unknown-linux-musleabi --release
