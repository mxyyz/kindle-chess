# specs/planning-context.yaml — written by elaborate-spec (e03 phase 2); consumed by scope-work / slice-tasks
# Overwrites the e02 context per user approval (e02 context archived in its epic capsule).
feature_name: e03-p2-live-game-friend-invite-flow
problem_statement: >-
  The home screen's "Demo" button launches an idle offline game. Phase 2 replaces it
  with a "Play" flow that leads the user into a live online Lichess game against a
  friend: pick a friend from the Lichess following list, choose a game mode
  (Unlimited / Real time 10:5 / Correspondence 1-14 days), send the challenge, and
  manage incoming/outgoing invites on a dedicated screen. Scoped to friend
  invites/inviting only. No keyboard on the Kindle — friend choice is a paged list,
  never free-text input.

constraints:
  - Rust + x11rb only; static musl armv7-unknown-linux-musleabi build unchanged
  - 1072x1448 absolute-pixel canvas unchanged; full repaint only on state change (e-ink)
  - run-dev.sh / Xephyr harness keeps working; all device-only behavior degrades to no-ops
  - litchee =0.2.2 crate: RelationsApi::following / ChallengesApi::{list, challenge, accept, decline, cancel};
    ChallengeRequest builder: rated(false), color(random), clock(limit_secs, inc_secs), days(n), variant standard
  - OAuth scopes challenge:read + challenge:write already requested (models/oauth.rs)
  - Existing ChessGameScreen + stream_game / BoardAPI::attach_game reused for the live game
  - Home screen keeps 4 buttons; "Demo" is renamed "Play" and requires auth (existing QR flow first)
  - assets/invitation.png used for the invites icon button (IconButton, 134x134 footprint)

flow:
  - 'HomeScreen "Play" -> PlayScreen (the "form")'
  - 'PlayScreen: title top-left; invitation IconButton top-right (x=914, y=24) -> InvitesScreen; game-mode button group (Unlimited / Real time 10:5 / Correspondence) at y~140-260 with days-per-move spinner (- / + around value, clamped 1-14) for correspondence; opponent selector button ("Opponent: -" / chosen username) at y~400 -> pushes FriendlistScreen; "Send challenge" button at y~530 (enabled only with opponent selected); status line y~1240; Back bottom-left'
  - 'FriendlistScreen (mirrors OngoingChessGamesScreen: 4 friend buttons 600x96 from y~400, next/prev page icons, Back, loading/error states): pages RelationsApi::following; tap friend -> AppEvent::FriendSelected(username) + Pop; PlayScreen (top of stack) fills opponent field'
  - 'Send challenge -> ChallengesApi::challenge(user).rated(false).color(random) + clock(600,5) for realtime / days(n) for correspondence / neither for unlimited -> push InvitesScreen'
  - 'InvitesScreen: "Incoming" rows with Accept/Decline, "Outgoing" rows with Cancel; poll list ~5s; accept in either direction -> Push ChessGameScreen attached to game id with live stream'

key_decisions:
  - decision: three screens — PlayScreen (form), FriendlistScreen (opponent pick), InvitesScreen (challenges)
    rationale: user request — friend choice extracted like OngoingGamesScreen, returns username to the Play form via pop+event; invites separated via invitation.png icon top-right of Play
  - decision: friend selection from RelationsApi::following list, no on-screen keyboard
    rationale: Kindle has no keyboard; building a text-input widget is out of scope
  - decision: fixed challenge defaults — standard variant, casual (rated=false), random color
    rationale: user decision; configurable variants/rated later
  - decision: game mode via button group — Unlimited / Real time 10:5 (clock 600+5) / Correspondence days 1-14 via spinner
    rationale: user decision; 10:5 is the realtime default; spinner clamps 1-14
  - decision: incoming AND outgoing challenges on InvitesScreen with accept/decline/cancel, ~5s poll
    rationale: user confirmed "friend-invites and inviting" both directions
  - decision: game start (either direction accepted) pushes existing ChessGameScreen with stream
    rationale: reuse existing live-game machinery (BoardAPI/stream_game)

out_of_scope:
  - Arbitrary-username challenges (on-screen keyboard / text input widget)
  - Open/public challenges, bulk pairing, challenge AI
  - Rated games, variants other than standard, configurable realtime clocks, custom FEN
  - Rematch flow, lobby/matchmaking browser
  - KPM packaging, WAF, C++/GTK rewrite (carried from e02)
  - Phase 1 (on-device directory restructure) and phase 3 (i18n German) — scoped separately in specs/product/SCOPE_LATEST.yaml

success_criteria:
  - cargo build (dev + cross musl) + cargo test green
  - 'On-device k2 UAT: Play -> pick friend -> choose mode -> send -> appears on InvitesScreen as outgoing; accept incoming -> ChessGameScreen opens with live board; decline/cancel remove the row'
  - 'Failure paths: send/decline/cancel/network errors show status line + Retry; empty friendlist shows hint'
  - 'run-dev.sh: full flow exercisable against emulated display with a mocked/stubbed API where possible'
