# specs/planning-context.yaml — written by elaborate-spec (2026-11-10, e05 cycle); consumed by scope-work / slice-tasks
# Overwrites the e03 context (archived in its epic capsule).
feature_name: e05-safe-inapp-update (update bundle for binary + assets + chess_app.sh, with staged safe install) + restructure finish
problem_statement: >-
  The in-app GitHub updater only ships the release binary: new images under
  /mnt/us/kindlichess/assets/ and a new launcher chess_app.sh cannot be
  deployed in-app, and there is no preflight sanity check that the device can
  actually receive and install an update (arch, directories, free space). On
  top, the repo restructure (kindle_KUAL removed, bundle at repo-root
  kindlichess/, crate root renamed to crate/, scriptlet-only launch) still has
  stale references in flash scripts, run-dev.sh and docs, and files under
  kindlichess/ do not trigger a release tag (release-please only watches
  crate/), so asset/script changes would never reach the in-app updater.

constraints:
  - Rust + x11rb; static musl armv7-unknown-linux-musleabi cross build stays green; cargo test/clippy/fmt green in CI
  - Device: k2, armv7l, /mnt/us is fuse.fsp (rw), busybox tar 1.34.1 + gzip + sha256sum available (spike-proven), ~3.1 GB free
  - 1072x1448 canvas and all current screens unchanged; update UX fits UpdateScreen
  - scriptlet/kindlichess.sh is NOT updated in-app (stays as deployed trampoline entry)
  - No asset embedding in the binary (user decision — embedding blurs what ships where; spike proved it works if ever needed, remember the black_box gotcha)
  - No new runtime dependencies unless justified (tar/sha256 run via device shell, not in the binary)
  - Release assets contract: keep legacy kindle-chess-armv7-musl{,.sha256} during transition so 0.4.0 clients can still update
  - Historical artifacts (specs/epics, CHANGELOG) keep old path names

flow:
  - release.yml builds update.tar.gz = { bin/kindle-hello, assets/, chess_app.sh, MANIFEST.sha256 (per-file sha256 of bundle contents) } and uploads it + update.tar.gz.sha256 alongside the legacy assets
  - release-please: add kindlichess/ as extra-files of the crate package so asset/script changes trigger a tag
  - app: check_for_update finds bundle asset; preflight (asset name arch suffix matches compiled target, runtime uname -m = armv7l, APP dirs exist+writable, df -k ROOT_DIR available >= 2x bundle size) -> download to <exe>.bundle.new streaming+hashing -> verify sidecar sha256 -> extract to staging dir -> verify MANIFEST per-file -> park for launcher
  - chess_app.sh at next launch: if bundle .new exists, extract to .staging, verify MANIFEST, install binary (existing .new mv), copy assets over, self-update script (chess_app.sh.new -> mv -> exec self), clean staging; any failure -> remove staging, keep old install
  - UpdateScreen shows bundle size/contents, preflight failure reason, progress, Applied -> relaunch hint; EN/DE strings

key_decisions:
  - decision: single tar.gz bundle (option B) as one release asset + one sha256 sidecar + in-bundle MANIFEST
    rationale: spike proved device tar roundtrip on /mnt/us; atomic all-or-nothing install; one download/storage check; user lean
  - decision: no asset embedding (option C rejected)
    rationale: user decision — config/assets split would blur; spike showed +~1.4 MB and the const-folding gotcha
  - decision: staged install via .new sidecars + launcher trampoline, never in-place while running
    rationale: existing binary trampoline already works on fuse.fsp; extends to bundle atomically
  - decision: preflight sanity checks before download (arch, dirs, writable, free space)
    rationale: user requirement — fail early with a readable reason instead of a half-written update
  - decision: release trigger covers kindlichess/ via release-please extra-files on the crate package
    rationale: otherwise asset/script changes never produce a tag and the updater never sees them
  - decision: scriptlet kindlichess.sh not updated in-app
    rationale: user — it is the stable entry point; chess_app.sh is the updatable launcher
  - decision: legacy binary-only assets stay on the release during transition
    rationale: 0.4.0 clients expect exactly those two asset names

out_of_scope:
  - Embedding assets in the binary (rejected; spike documented)
  - Recreating the KUAL menu extension (dropped — scriptlet-only launch)
  - In-app update of scriptlet/kindlichess.sh
  - litchee migration, new game features, rated/variants/rematch, multi-device layouts
  - Physical on-device UAT of a real release beyond the spike probe (manual, k2 on LAN)

success_criteria:
  - Device spike: tar roundtrip OK, sha256sum OK, dirs OK, writable OK (DONE 2026-11-10, see SPIKE doc)
  - cargo build (dev + cross musl) + cargo test + clippy -D warnings + fmt --check green
  - release.yml produces update.tar.gz + sidecar; bundle MANIFEST verifies locally in a dry run
  - app preflight blocks wrong-arch / missing-dir / low-space with a readable UpdateScreen message (unit-tested parsers)
  - staged update: .new sidecar + sha256 verify + trampoline install at next launch; any failure leaves the running install untouched (host-harness test of trampoline against fake APP_DIR)
  - no remaining kindle_KUAL/hellokindle references outside historical artifacts; sh -n on all scripts
  - docs (CLAUDE.md, ARCHITECTURE, ci-cd, tech-stack) describe bundle update + scriptlet-only launch
