---
# specs/product/SCOPE_LATEST.yaml — bounded PRD for the current initiative (e05)
# Written by scope-work (2026-11-10 planning cycle). Consumed by slice-tasks / plan-work.
# Previous (e04) scope archived at specs/epics/e04-e01-leftovers/SCOPE.yaml
feature_name: e05-ondevice-restructure-finish (scriptlet-only launch, repo layout cleanup)
core_value: >-
  Finish the on-device directory restructure the user started on main: the
  deployable app bundle is now repo-root kindlichess/ (no more kindle_KUAL/
  wrapper), launch on the device is scriptlet-only, and every script, doc and
  ignore rule matches that layout — so the next deploy works end to end.
summary: >-
  The repo was restructured on main: kindle_KUAL/ (extensions/hellokindle KUAL
  wiring + kindlichess app bundle) was removed and the app bundle now lives at
  repo-root kindlichess/, with scriptlet/kindlichess.sh as the on-device launcher
  (SH_Integration auto-registers .sh files in /mnt/us/documents). The crate root
  was also renamed kindle_chess -> crate in the same pass. What remains is the
  follow-through: flash.sh / flash_usb.sh still deploy the deleted kindle_KUAL/
  tree, .gitignore still ignores paths under kindle_KUAL/, run-dev.sh still
  points HELLOKINDLE_DIR at it, and CLAUDE.md / docs/ / tech-stack.md / the
  crate's api README still describe the old layout and the KUAL menu.

  User decision (2026-11-10): scriptlet-only launch — the KUAL menu extension
  (extensions/hellokindle) is dropped, not recreated. All remaining KUAL
  references are removed rather than rewired.

in_scope:
- >-
  e05s01 (deploy scripts): flash.sh and flash_usb.sh deploy repo-root
  kindlichess/ to /mnt/us (binary into kindlichess/bin/, assets/config/scripts
  via scp/cp of kindlichess/*) plus scriptlet/kindlichess.sh to
  /mnt/us/documents; the move-token-aside dance now targets
  kindlichess/secrets/token.json; `mkdir -p kindlichess/bin` before copying;
  comments updated; `sh -n` clean
- >-
  e05s02 (repo hygiene): .gitignore entries kindle_KUAL/kindlichess/{bin,
  secrets,log}/* become kindlichess/{bin,secrets,log}/*; no secrets or binaries
  tracked; stale entries removed
- >-
  e05s03 (dev harness): run-dev.sh HELLOKINDLE_DIR points at
  $REPO_ROOT/kindlichess; crate/.env.debug ROOT_DIR already updated — verify
  the dev harness resolves assets/log/secrets from the new bundle location
- >-
  e05s04 (docs sweep): CLAUDE.md, docs/ARCHITECTURE.md, docs/ci-cd.md,
  docs/dev/kindle-usb-ssh.md, specs/tech-architecture/tech-stack.md and
  crate/src/api/README.md updated to the new layout: kindle_KUAL/kindlichess
  -> kindlichess, /mnt/us/hellokindle -> /mnt/us/kindlichess, KUAL menu
  references removed, scriptlet launch documented as the only entry point
- >-
  e05s05 (verification): zero remaining references to kindle_KUAL/ or
  hellokindle outside historical artifacts (specs/epics/, CHANGELOG.md);
  sh -n on all shell scripts; cargo build + cargo test green from crate/;
  run-dev.sh path resolution smoke check (no full X11 run required)
out_of_scope:
- >-
  Recreating the KUAL menu extension (extensions/hellokindle) — user decision
  2026-11-10: scriptlet-only launch, KUAL dropped
- >-
  Any change to on-device runtime behavior of chess_app.sh or the binary —
  chess_app.sh already targets /mnt/us/kindlichess; this epic is repo wiring
  only
- >-
  Physical-device UAT (flash to a real Kindle and launch via scriptlet) —
  needs the k2 on the LAN; manual check, not part of CI
- >-
  litchee migration, new game features, multi-device layouts — separate
  initiatives (see specs/LITCHEE_MIGRATION_PLAN.md, e03 out_of_scope)
constraints:
- >-
  Shell scripts stay POSIX sh (`sh -n` must pass); no new dependencies
- >-
  Binary name and on-device paths unchanged: /mnt/us/kindlichess/...,
  bin/kindle-hello
- >-
  secrets (token.json, puzzle_history.json), logs and binaries must never be
  committed — .gitignore must cover them under the new kindlichess/ root
- >-
  crate/ build must stay green; docs-only and script-only changes must not
  touch crate/src except README path references
- >-
  Historical artifacts (specs/epics/*, specs/verifications/*, crate/CHANGELOG.md)
  keep their old path references — they document what was true at the time
success_criteria:
- >-
  `grep -rn "kindle_KUAL\|hellokindle"` outside .git, crate/target, specs/epics,
  specs/verifications and CHANGELOG returns nothing
- >-
  flash.sh / flash_usb.sh reference only kindlichess/ and scriptlet/, pass
  `sh -n`, and preserve the token-aside dance against kindlichess/secrets/
- >-
  .gitignore covers kindlichess/bin|secrets|log; `git status` shows no secrets
  or binaries under kindlichess/
- >-
  run-dev.sh resolves HELLOKINDLE_DIR to the repo-root kindlichess/ bundle
- >-
  cargo build + cargo test green from crate/ after all changes
- >-
  CLAUDE.md / docs describe the scriptlet-only launch and the repo-root
  kindlichess/ bundle accurately
trade_offs:
- item: KUAL menu dropped instead of rewired
  reason: user decision 2026-11-10 — scriptlets auto-register via SH_Integration,
    one launch path is simpler than maintaining two
- item: physical-device UAT left manual
  reason: needs the Kindle on the LAN; CI covers build, tests, lint and script
    syntax only
- item: historical specs keep old paths
  reason: epic capsules and CHANGELOG are point-in-time records; rewriting them
    would falsify history
references:
- scriptlet/kindlichess.sh (scriptlet launcher deployed to /mnt/us/documents)
- kindlichess/chess_app.sh (on-device launcher, already on /mnt/us/kindlichess)
- flash.sh, flash_usb.sh, run-dev.sh, .gitignore
- CLAUDE.md, docs/ARCHITECTURE.md, docs/ci-cd.md, docs/dev/kindle-usb-ssh.md
- specs/tech-architecture/tech-stack.md
- specs/epics/e03-target-device-directory-restructure/ (e03s01 on-device rename)
