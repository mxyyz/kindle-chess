tasks:
- id: e05s04t01
  description: 'Trampoline v2 at top of chess_app.sh (after sanity checks, before binary exec): if $BINARY.bundle.new exists
    -> extract to $APP_DIR/.staging (tar -xzf), verify (cd .staging && sha256sum -c MANIFEST.sha256), then install: mv .staging/bin/kindle-hello
    $BINARY (keep old on failure), cp -f .staging/assets/* assets/, script self-update: if .staging/chess_app.sh differs,
    cp to chess_app.sh.new, mv over chess_app.sh, exec "$0" "$@" to re-run under the new script; rm -rf .staging + bundle.new
    on success; on any failure rm -rf .staging bundle.new and continue with old install.'
  verify: sh -n kindlichess/chess_app.sh && grep -q 'bundle.new' kindlichess/chess_app.sh && grep -q 'sha256sum -c' kindlichess/chess_app.sh
  risk: P0
  status: passing
  allure:
    severity: critical
    categories:
    - e05-update-bundle
    - launcher
    - trampoline
