- id: t02-mock-http-client
  title: Add Mock HTTP Client
  phase: 1
  priority: P0
  estimate_hours: 2
  # DESIGN CHANGE from original spec: a trait over reqwest::Response is
  # unimplementable (a Response can't be synthesised offline). The seam is
  # instead the response BODY (String): PuzzleFetcher in src/api/traits.rs,
  # real ReqwestFetcher + test MockFetcher. api.rs puzzle fetches refactored
  # to *_with(fetcher) variants; public fns delegate via ReqwestFetcher so
  # callers are unchanged. Also added a [lib] target so tests/ can link.
  # Scope: puzzle endpoints only (get_daily_puzzle, get_puzzle_by_id);
  # oauth.rs / board.rs integration deferred to t09 / t10.
  status: complete
  description: |
    Create mock implementations for reqwest client to enable API testing.
    The mock should implement a trait that both reqwest::Client and the mock
    satisfy, allowing dependency injection in API functions.
  acceptance_criteria:
    - MockHttpClient trait defined
    - Mock implementation that returns configurable responses
    - Integration with api/api.rs (puzzle fetching)
    - Integration with api/oauth.rs (token exchange)
    - Integration with api/board.rs (game data)
  files_created:
    - kindle_chess/tests/helpers/mock_http.rs
    - kindle_chess/src/api/traits.rs
  files_modified:
    - kindle_chess/src/api/api.rs
    - kindle_chess/src/api/oauth.rs
    - kindle_chess/src/api/board.rs
  dependencies:
    - t01-create-test-structure
  blocker: false

- id: t03-bitboard-tests
  title: Expand Bitboard Tests
  phase: 1
  priority: P0
  estimate_hours: 3
  status: complete
  description: |
    Add comprehensive tests for the bitboard module. Currently has 5 tests,
    target is 25+ tests covering all core chess logic.
  acceptance_criteria:
    - All existing 5 tests still pass
    - 20+ new tests added
    - Total >= 25 tests in bitboard module
    - cargo test --lib bitboard passes
  test_categories:
    - FEN parsing (10 tests):
        - Standard starting position
        - Empty board
        - Single piece positions
        - Invalid FEN (wrong rank count, unknown pieces, overflow)
        - startpos alias
        - Side-to-move parsing (w, b, invalid)
    - Piece movement (8 tests):
        - Each piece type can be placed and queried
        - piece_at returns correct (Color, Piece) for all 64 squares
        - board() returns correct bitboard for each (Color, Piece)
    - UCI move application (7 tests):
        - Simple pawn move
        - Pawn double move
        - Pawn capture
        - Knight move (L-shape)
        - Bishop move (diagonal)
        - Rook move (straight)
        - Queen move (any direction)
        - King move (one square)
    - Special moves (5 tests):
        - Kingside castling (O-O)
        - Queenside castling (O-O-O)
        - Castling with pieces in between (should fail)
        - En passant capture
        - Promotion to Queen
        - Promotion to Knight
        - Promotion to Rook
        - Promotion to Bishop
    - Edge cases (5 tests):
        - Move from empty square
        - Move to occupied square (same color)
        - Capture (opponent piece)
        - Invalid UCI format (too short, bad squares)
        - Square indexing (square() and bit() functions)
  files_created: []
  files_modified:
    - kindle_chess/src/models/bitboard.rs
  dependencies: []
  blocker: false

