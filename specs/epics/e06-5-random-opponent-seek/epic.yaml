# Epic capsule manifest — e06.5 random-opponent-seek
# Sliced 2026-11-11 after user review of e06s08: the Play form's "Random"
# opponent must use the official board seek endpoint POST /api/board/seek
# (https://lichess.org/api#tag/board/POST/api/board/seek), NOT
# POST /api/challenge/open. Per the official API the seek connection must
# stay established (dropping it cancels the seek), and the event stream
# GET /api/stream/event (https://lichess.org/api#tag/board/GET/api/stream/event)
# should be open BEFORE starting the seek so the gameStart event is not missed.
#
# litchee 0.2.2 support verified against the vendored source
# (registry litchee-0.2.2/src/api/gameplay/board.rs):
# - BoardApi::seek() -> SeekRequest -> POST /api/board/seek, form fields
#   rated / time (MINUTES, f32) / increment (secs) / days / variant / color /
#   ratingRange — note: time+increment, NOT clock.limit/clock.increment like
#   the challenge endpoints. send() returns BoxStream<'static, Result<Value>>
#   (NDJSON); "Hold the returned stream open to keep the seek active; dropping
#   it cancels the seek".
# - BoardApi::stream_events() -> GET /api/stream/event ->
#   BoxStream<Result<LichessIncomingEvent>> with variants gameStart/gameFinish/
#   challenge/challengeCanceled/challengeDeclined; gameStart shape
#   {"type":"gameStart","game":{"gameId":"g",...}} (litchee's own test).
# - OAuth scope: seek requires board:play (or bot:play) — the app already
#   requests board:play (models/oauth.rs AuthConfig::default scopes).
epic_id: e06.5
status: planned (capsule written 2026-11-11; runs after e06, before e07)
scope: specs/product/SCOPE_LATEST.yaml
