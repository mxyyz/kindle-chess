# Phase 1: Lifecycle (fullscreen UX preserved, PC:N)

- id: t01-awm-window-title
  title: AWM window-title module + WM_NAME on the X11 window
  phase: 1
  priority: P0
  estimate_hours: 3
  status: complete
  description: |
    New module kindle_chess/src/ui/awm.rs that builds an AWM-conformant window
    title from parts (layer, role, PC flags, ID, orientation) and applies it to
    the app window via x11rb change_property(WM_NAME). Phase 1 title:
    L:A_N:application_PC:N_ID:org.kindlemodding.kindlechess_O:U
    PC:N keeps fullscreen (no chrome) in Phase 1; PC:T variant lands in t05.
    override_redirect stays for Phase 1 (pillow still disabled by launcher);
    the title is what AWM reads in Phase 2 when the window becomes managed.
    Setting WM_NAME under Xephyr is harmless (no AWM), so no cfg gating needed.
  acceptance_criteria:
    - awm::WindowTitle builder with unit tests for the exact title string format
    - renderer.rs applies WM_NAME right after create_window/map_window
    - cargo build + cargo test green
    - NOTE: on-device UAT of the title is deferred until t05 (PC:T) lands — in
      Phase 1 (override_redirect + pillow disabled) AWM never reads WM_NAME,
      so there is nothing user-visible to test yet
  files_created:
