# Epic e02-native-kindle-integration - Task Specifications
# Format: YAML for machine readability and CI integration
# Planning context: specs/planning-context.yaml

---
# Phase 1: Lifecycle (fullscreen UX preserved, PC:N)

- id: t01-awm-window-title
  title: AWM window-title module + WM_NAME on the X11 window
  phase: 1
  priority: P0
  estimate_hours: 3
  status: complete
  description: |
    New module kindle_chess/src/ui/awm.rs that builds an AWM-conformant window
    title from parts (layer, role, PC flags, ID, orientation) and applies it to
    the app window via x11rb change_property(WM_NAME). Phase 1 title:
    L:A_N:application_PC:N_ID:org.kindlemodding.kindlechess_O:U
    PC:N keeps fullscreen (no chrome) in Phase 1; PC:T variant lands in t05.
    override_redirect stays for Phase 1 (pillow still disabled by launcher);
    the title is what AWM reads in Phase 2 when the window becomes managed.
    Setting WM_NAME under Xephyr is harmless (no AWM), so no cfg gating needed.
  acceptance_criteria:
    - awm::WindowTitle builder with unit tests for the exact title string format
    - renderer.rs applies WM_NAME right after create_window/map_window
    - cargo build + cargo test green
    - NOTE: on-device UAT of the title is deferred until t05 (PC:T) lands — in
      Phase 1 (override_redirect + pillow disabled) AWM never reads WM_NAME,
      so there is nothing user-visible to test yet
  files_created:
    - kindle_chess/src/ui/awm.rs
  files_modified:
    - kindle_chess/src/ui/mod.rs
    - kindle_chess/src/ui/renderer.rs
  dependencies: []
  blocker: false

- id: t02-scriptlet-launcher
  title: Scriptlet launcher at repo-root scriptlet/ + flash deploy wiring
  phase: 1
  priority: P0
  estimate_hours: 1
  status: complete
  description: |
    REVISED twice after user feedback. Current shape:
    - scriptlet/kindle-chess.sh (repo root, NOT inside kindle_KUAL) with
      # Name: Kindli-Chess / # Author / # Icon: /mnt/us/hellokindle/assets/chess-king.png,
      execs chess_app.sh --scriptlet. flash.sh / flash_usb.sh copy it to
      /mnt/us/documents/, where k2's SH_Integration auto-registers it as a
      launchable library item (kindlemodding.org/kindle-dev/scriptlets.html).
    - chess_app.sh remains the KUAL launcher (menu.json action, --kual).
    - appreg.db registration (register_appreg.sh + KUAL entry) was tried for
      k1 but does NOT work there (possibly account-dependent) — removed again,
      deferred (out of scope for now). KUAL covers k1.
  acceptance_criteria:
    - scriptlet/kindle-chess.sh executable, Name/Author/Icon metadata present,
      sh -n clean; menu.json valid JSON
    - flash scripts deploy the scriptlet to /mnt/us/documents
    - k2 UAT: scriptlet appears in library and launches (--scriptlet in launch.log)
  files_created:
    - scriptlet/kindle-chess.sh
  files_modified:
    - flash.sh
    - flash_usb.sh
    - kindle_KUAL/hellokindle/chess_app.sh
  dependencies: []
  blocker: false

- id: t03-powerd-lock-aware-watcher
  title: Display-lock-aware powerd watcher (lock + wake) -> redraw on wake
  phase: 1
  priority: P1
  estimate_hours: 4
  status: complete
  description: |
    REVISED — was wake-only. kindle_chess/src/system/powerd.rs now classifies raw
    lipc-wait-event lines (com.lab126.powerd "*") into PowerEvent::Lock
    (goingToScreenSaver) and PowerEvent::Wake (outOfScreenSaver), debounced 2s
    per kind, emitted as AppEvent::DeviceLock / AppEvent::DeviceWake. App loop:
    DeviceWake -> full redraw of top screen (clean e-ink panel after unlock);
    DeviceLock -> logged, hook point for the custom screensaver (t08). While
    locked the panel simply freezes (pillow disabled, no Amazon screensaver).
    Off-device (no lipc tools) the watcher logs once and exits — no-op.
  acceptance_criteria:
    - classify_powerd_event + should_emit unit tests green
    - AppEvent::DeviceLock and DeviceWake both routed in the app loop
    - off-device: no-op with a single log line; cargo build + cargo test green
    - on-device UAT: lock/unlock observed in log; board redraws cleanly on unlock
  files_created:
    - kindle_chess/src/system/mod.rs
    - kindle_chess/src/system/powerd.rs
  files_modified:
    - kindle_chess/src/lib.rs
    - kindle_chess/src/ui/events.rs
    - kindle_chess/src/app/app.rs
  dependencies:
    - t01-awm-window-title
  blocker: false

- id: t04-launch-script-hardening
  title: Launch-source logging; chess_app.sh = KUAL launcher, scriptlet/ = scriptlet launcher
  phase: 1
  priority: P2
  estimate_hours: 1
  status: complete
  description: |
    REVISED — chess_app.sh is now purely the KUAL launcher script; the scriptlet
    path is the dedicated repo-root scriptlet/kindle-chess.sh (t02). chess_app.sh
    logs its source argument (--kual from menu.json, --scriptlet from the
    scriptlet) in launch.log. Pillow disable/enable handoff and eips -c/-f stay
    as-is (Phase 1 fullscreen). token.json dance in flash scripts untouched.
  acceptance_criteria:
    - launch.log records the source parameter
    - chess_app.sh contains no registration logic
    - sh -n clean
  files_modified:
    - kindle_KUAL/hellokindle/chess_app.sh
  dependencies:
    - t02-scriptlet-launcher
  blocker: false

