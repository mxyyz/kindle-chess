# Phase 2: Chrome (PC:T top bar + sidebar button)

- id: t05-pc-t-title
  title: Runtime-toggleable PC:T status bar over the app (no layout shift)
  phase: 2
  priority: P1
  estimate_hours: 5
  status: complete
  description: |
    REVISED per user correction: PC:T only — NO home/search buttons come up, just
    the status bar; and the status bar OVERLAYS the app's top strip — the
    1072x1448 canvas is NOT shifted/pushed down (no LAYOUT offset).
    Implementation: Renderer::set_chrome_mode(chrome) applies the AWM title
    (PC:T vs PC:N — live WM_NAME update) and recreates the window when the
    override-redirect value changes (it is a create-time-only X11 attribute;
    GCs carry over). Display::set_chrome_mode wraps it with the pillow handoff
    via system/pillow.rs (lipc-set-prop com.lab126.pillow disableEnablePillow
    enable/disable, eips -c on return to fullscreen) — all no-ops off-device.
    AppConfig.chrome_on_start (default false) starts directly in chrome mode.
    chess_app.sh unchanged: still disables pillow at launch (fullscreen start).
  acceptance_criteria:
    - awm title unit tests green; cargo build + cargo test green
    - off-device: toggle is a safe no-op for pillow/eips, title/override logic exercised
    - on-device UAT (t07): toggling shows ONLY the Kindle status bar drawn over
      the app's top strip (no layout shift, no home buttons), brightness
      reachable from it; toggling back restores clean fullscreen
  files_created:
    - kindle_chess/src/system/pillow.rs
  files_modified:
