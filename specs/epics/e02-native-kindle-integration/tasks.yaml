- id: t08-custom-screensaver
  title: Custom screensaver on DeviceLock (instead of frozen panel / Amazon SS)
  phase: 2
  priority: P3
  estimate_hours: 4
  status: pending
  description: |
    Hook AppEvent::DeviceLock to draw a custom screensaver (e.g. clock + last
    position mini-board) over the current screen; DeviceWake already triggers the
    full redraw. User is not keen on the default Amazon screensaver; while pillow
    is disabled the panel currently just freezes on lock. Decide whether the SS
    is drawn via our X11 window or by re-enabling pillow for the SS only.
  acceptance_criteria:
    - on lock, a custom screensaver is drawn; on unlock, the app screen is restored cleanly
    - cargo build + cargo test green
  files_created: []
  files_modified:
    - kindle_chess/src/app/app.rs
    - kindle_chess/src/ui/screens.rs (new screensaver screen)
  dependencies:
    - t03-powerd-lock-aware-watcher
  blocker: false
