# Epic e02-native-kindle-integration - Task Specifications
# Format: YAML for machine readability and CI integration
# Planning context: specs/planning-context.yaml

---
# Phase 1: Lifecycle (fullscreen UX preserved, PC:N)

- id: t01-awm-window-title
  title: AWM window-title module + WM_NAME on the X11 window
  phase: 1
  priority: P0
  estimate_hours: 3
  status: complete
  description: |
    New module kindle_chess/src/ui/awm.rs that builds an AWM-conformant window
    title from parts (layer, role, PC flags, ID, orientation) and applies it to
    the app window via x11rb change_property(WM_NAME). Phase 1 title:
    L:A_N:application_PC:N_ID:org.kindlemodding.kindlechess_O:U
    PC:N keeps fullscreen (no chrome) in Phase 1; PC:T variant lands in t05.
    override_redirect stays for Phase 1 (pillow still disabled by launcher);
    the title is what AWM reads in Phase 2 when the window becomes managed.
    Setting WM_NAME under Xephyr is harmless (no AWM), so no cfg gating needed.
  acceptance_criteria:
    - awm::WindowTitle builder with unit tests for the exact title string format
    - renderer.rs applies WM_NAME right after create_window/map_window
    - cargo build + cargo test green
  files_created:
    - kindle_chess/src/ui/awm.rs
  files_modified:
    - kindle_chess/src/ui/mod.rs
    - kindle_chess/src/ui/renderer.rs
  dependencies: []
  blocker: false

- id: t02-appreg-registration
  title: appreg.db home-screen registration + install wiring
  phase: 1
  priority: P0
  estimate_hours: 4
  status: complete
  description: |
    New script kindle_KUAL/hellokindle/register_appreg.sh, idempotent:
    backs up /var/local/appreg.db, inserts handlerId org.kindlemodding.kindlechess
    into handlerIds + properties (command=/mnt/us/hellokindle/chess_app.sh,
    lipcId, supportedOrientation=U, default-chrome-style=N, unloadPolicy=unloadOnPause),
    plus an associations row (interface=application, contentId=none), then runs
    sqlite3 integrity check and rolls back from backup on any failure.
    Wired into flash.sh/flash_usb.sh after the scp/cp, so deploy registers the app.
    KUAL menu.json stays untouched (fallback for k1 without scriptlets).
    Off-device (no /var/local/appreg.db) the script exits 0 with a log line.
  acceptance_criteria:
    - script is idempotent (second run is a no-op)
    - failed sqlite write rolls back to the backup byte-identically
    - k2 home screen shows the chess icon after flash (UAT, device)
    - k1 KUAL path unaffected
  files_created:
    - kindle_KUAL/hellokindle/register_appreg.sh
  files_modified:
    - flash.sh
    - flash_usb.sh
  dependencies: []
  blocker: false

- id: t03-powerd-wake-refresh
  title: powerd resume -> full e-ink refresh
  phase: 1
  priority: P1
  estimate_hours: 4
  status: complete
  description: |
    New module kindle_chess/src/system/ (powerd watcher) started from main/App::new.
    Background thread shells out to the on-device lipc listener for
    com.lab126.powerd (resume/wake events); each event is debounced (>=2s apart)
    and sent as AppEvent::DeviceWake, which the app loop answers with a full
    redraw of the top screen (renderer clear + redraw; launcher already runs
    eips -f on exit). When lipc tools or the service are absent (dev harness,
    k1 without scriptlets) the watcher logs once and stays silent — no-op.
  acceptance_criteria:
    - AppEvent::DeviceWake variant exists and triggers full redraw
    - watcher thread exits cleanly on app quit
    - off-device: no-op with a single log line; cargo test green (debounce logic unit-tested)
    - on-device UAT: sleep/wake leaves a cleanly redrawn board
  files_created:
    - kindle_chess/src/system/mod.rs
    - kindle_chess/src/system/powerd.rs
  files_modified:
    - kindle_chess/src/lib.rs (or main.rs module tree)
    - kindle_chess/src/ui/events.rs
    - kindle_chess/src/app/ (event routing)
  dependencies:
    - t01-awm-window-title
  blocker: false

- id: t04-launch-script-hardening
  title: Launcher script cleanup for dual launch paths
  phase: 1
  priority: P2
  estimate_hours: 2
  status: in_progress
  description: |
    chess_app.sh keeps working as both the KUAL action and the appreg.db command.
    Add a --source=kual|appreg parameter for logging only; keep the pillow
    disable/enable handoff and eips -c/-f as-is (Phase 1 stays fullscreen);
    keep the token.json dance in flash scripts intact.
  acceptance_criteria:
    - script runs identically from KUAL and from appreg command
    - launch.log records the source parameter
  files_modified:
    - kindle_KUAL/hellokindle/chess_app.sh
  dependencies:
    - t02-appreg-registration
  blocker: false

