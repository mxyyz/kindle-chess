- id: t08-custom-screensaver
  title: Custom screensaver (logo.png) on DeviceLock
  phase: 2
  priority: P3
  estimate_hours: 4
  status: complete
  description: |
    While pillow is disabled no Amazon screensaver appears on lock — the panel
    just froze. Now AppEvent::DeviceLock draws our own screensaver via
    ui/screensaver.rs: clear white + assets/logo.png (the home-screen logo)
    pre-scaled to max 800px wide, centred on the 1072x1448 canvas. App gains a
    `locked` flag: lock sets it and draws the screensaver, wake clears it and
    does the existing full redraw + stream re-kick; all app redraws (bootstrap,
    Redraw/Push/Pop transitions) are suppressed while locked so stream events
    arriving mid-lock don't paint over the screensaver.
  acceptance_criteria:
    - cargo build + cargo test green
    - on-device UAT (t07): lock shows the logo screensaver; unlock restores the
      app screen cleanly and the game refetches (t03 behavior)
  files_created:
