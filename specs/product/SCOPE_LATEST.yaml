---
# specs/product/SCOPE_LATEST.yaml — bounded PRD for release cycle 2 (e06-e10)
# Written by scope-work from specs/planning-context.yaml (elaborate-spec, 2026-11-10).
# Consumed by slice-tasks / plan-work. Previous (e05) scope archived at
# specs/epics/e05-safe-inapp-update/SCOPE.yaml
feature_name: "release-cycle-2: e06 play-form enhancements + e07 UI polish + e08 settings tabs + e09 Mauseedition + e10 OSS licensing"
core_value: >-
  After e05's safe in-app update lands, the app becomes a fuller chess client:
  rated and computer/random games from the Play form with one-tap rematch,
  a polished uniform UI with auto-refresh and reusable components, a shared
  settings pattern, a fun unlockable puzzle edition, and proper open-source
  licensing so the project can be published.
summary: >-
  Release cycle 2 builds on e05 (safe in-app update bundle). e06 extends the
  Play form with a rated/casual toggle, opponent choices (friend via list-picker,
  computer via Lichess AI, random via open challenge/seek), and a rematch button
  on game-over. e07 is a UI-enhancements sweep: fix the invites pagination
  overlap bug, add conditional next-page buttons, recurring fetch on
  Games/Invites screens (5s × 30s then manual refresh), a daily-puzzle indicator
  on the Home button, per-item detail rows on OngoingGames and Invites, uniform
  screen titles and layout, a reusable list-picker modal, color-orientation-aware
  file/rank labels on the board, and fix the piece-move shadow residue. e08
  restructures the settings screen into 2 tabs (screen-specific + shared general
  settings). e09 adds the "Mauseedition" — a hardcoded puzzle set where each
  correct move unlocks a letter forming a sentence, shipped as a second release
  asset with an unlock method in the UpdateScreen. e10 researches and applies
  OSS licensing: choose a license, add LICENSE + NOTICE/THIRD-PARTY attribution
  for icons, fonts, and all cargo dependencies.

in_scope:
  - >-
    e06 play-form enhancements: rated/casual toggle, opponent picker
    (friend/computer/random), rematch button; litchee challenge_ai /
    create_open / seek / rated APIs
  - >-
    e07 UI enhancements: invites pagination bug fix, conditional pagination,
    recurring fetch (Games + Invites), Home puzzle indicator, per-item details
    (OngoingGames + Invites), uniform titles/layout, list-picker modal,
    file/rank labels, piece-move shadow fix
  - >-
    e08 2-tab settings screen: screen-specific primary tab + shared general
    settings secondary tab
  - >-
    e09 Mauseedition: hardcoded puzzle set with letter-unlock mechanic, custom
    sidebar + main screen, second release asset + UpdateScreen unlock
  - >-
    e10 OSS licensing: research, choose license, LICENSE file, NOTICE/THIRD-PARTY
    attribution for icons/fonts/libraries, README license reference

out_of_scope:
  - Game variants (Chess960 etc.) in the challenge form — deferred
  - Separate bot-play mode — "computer" is an opponent option only
  - Multi-device layout support — separate initiative
  - Lobby/browse open challenges as a new screen — InvitesScreen already covers this
  - Physical on-device UAT beyond CI/host tests — manual, needs k2 on LAN
  - Rewriting historical artifacts (specs/epics/, CHANGELOG.md)

constraints:
  - Rust + x11rb; static musl armv7 cross build green; CI fmt + clippy -D warnings + test + cross + coverage
  - 1072x1448 canvas; new UI fits within ui/layout.rs constants
  - litchee 0.2.2 already integrated — use its APIs, no new HTTP client
  - No new runtime dependencies unless justified
  - EN/DE i18n for all new strings
  - e05 lands first (wsjf_order 1); e09's second release asset depends on e05's bundle pipeline
  - Shell scripts stay POSIX sh

success_criteria:
  - e06: rated/casual + friend/computer/random opponent + rematch all work end-to-end; unit tests on challenge params
  - e07: all listed UI bugs fixed, QOL features live, uniform layout, list-picker reused in ≥2 places, board labels + shadow fix verified
  - e08: settings 2-tab pattern live; general settings accessible from any screen with settings
  - e09: Mauseedition playable, letters unlock, sentence revealed, second asset in release
  - e10: LICENSE + NOTICE files present, license decision in ADR, README references license
  - All epics: cargo build (dev + cross) + test + clippy -D warnings + fmt --check green

trade_offs:
  - item: "random opponent via create_open vs seek"
    reason: create_open creates a challenge anyone can accept (shows in Invites); seek is the lobby mechanism. Plan-work will pick per UX fit — both available in litchee 0.2.2
  - item: rematch as new challenge vs dedicated API
    reason: Lichess has no dedicated rematch endpoint for board games; sending a new challenge with same params is the standard approach
  - item: e09 as second release asset vs compile-time feature flag
  - item: "e09 as second release asset vs compile-time feature flag"
    reason: "user wants a separate edition — second asset rides e05 bundle pipeline; alternative (feature flag in one binary) deferred"
  - item: "Apache 2.0 vs MIT for e10"

references:
  - specs/planning-context.yaml (elaborate-spec decisions, 2026-11-10)
  - litchee 0.2.2 source: ~/.cargo/registry/.../litchee-0.2.2/src/api/gameplay/challenges.rs, board.rs
  - crate/src/ui/screens/play.rs, invites.rs, ongoing_games.rs, home.rs, chess_game.rs, settings.rs
  - crate/src/ui/layout.rs, crate/src/ui/widgets/
  - kindlichess/assets/ (icons), crate/assets/AdwaitaSans-Regular.ttf (font)
  - choosealicense.com, cargo-about for licensing
