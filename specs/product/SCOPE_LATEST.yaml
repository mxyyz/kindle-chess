---
# specs/product/SCOPE_LATEST.yaml — bounded PRD for the current initiative (e05)
# Written by scope-work from specs/planning-context.yaml (elaborate-spec, 2026-11-10).
# Consumed by slice-tasks / plan-work. Previous (e04) scope archived at
# specs/epics/e04-e01-leftovers/SCOPE.yaml
feature_name: "e05-safe-inapp-update (in-app update bundle: binary + assets + chess_app.sh, staged & sanity-checked) + restructure finish"
core_value: >-
  The app can update everything it ships — binary, images and the launcher
  script — from one verified bundle, and refuses to start an update the device
  cannot safely receive and install.
summary: >-
  Today the in-app updater only downloads the release binary; new assets and a
  new chess_app.sh never reach the device, and nothing checks whether the
  device can actually take the update. e05 ships option B (spike-proven on the
  k2): release.yml packs bin/kindle-hello + assets/ + chess_app.sh +
  MANIFEST.sha256 into one update.tar.gz release asset with a sha256 sidecar.
  The app preflights (arch, dirs, writability, free space), streams the bundle
  to a .new sidecar, verifies the sidecar then the per-file manifest, and the
  launcher installs it atomically at next start — any failure leaves the
  running install untouched. release-please learns to trigger on kindlichess/
  changes so asset/script edits actually produce a release. The small
  restructure finish rides along: flash scripts, run-dev.sh and docs point at
  the repo-root kindlichess/ bundle, launch is scriptlet-only.

in_scope:
- >-
  e05s01 (restructure finish): flash.sh/flash_usb.sh deploy repo-root
  kindlichess/ + scriptlet/kindlichess.sh to /mnt/us/documents (token-aside
  dance preserved); run-dev.sh HELLOKINDLE_DIR; .gitignore already fixed;
  docs sweep (CLAUDE.md, docs/ARCHITECTURE.md, docs/ci-cd.md,
  docs/dev/kindle-usb-ssh.md, specs/tech-architecture/tech-stack.md,
  crate/src/api/README.md) — no kindle_KUAL/hellokindle refs outside history;
  scriptlet-only launch documented
- >-
  e05s02 (release pipeline): release.yml builds update.tar.gz (binary +
  kindlichess/assets + kindlichess/chess_app.sh + MANIFEST.sha256) and uploads
  bundle + sidecar, keeping legacy binary assets during transition;
  release-please config adds kindlichess/ as extra-files of the crate package
  so asset/script changes trigger a tag
- >-
  e05s03 (app update client v2): github.rs locates the bundle asset; update.rs
  preflight (arch suffix vs compiled target + runtime uname -m, APP dirs
  exist/writable, df -k free >= 2x bundle size), streaming download to
  <exe>.bundle.new with hash, sidecar verify, extract to staging, MANIFEST
  per-file verify; ChessError carries the failure reason; unit tests for
  manifest/df parsing
- >-
  e05s04 (launcher trampoline v2): chess_app.sh at launch installs a staged
  bundle atomically (extract to .staging, verify MANIFEST, mv binary, copy
  assets, self-update via chess_app.sh.new + mv + exec), cleanup on failure;
  POSIX sh; host-harness test against a fake APP_DIR
- >-
  e05s05 (UpdateScreen UX + i18n): bundle size/contents, preflight failure
  reasons, progress, Applied -> relaunch hint; EN/DE strings
- >-
  e05s06 (verification + docs): full local gates green (build, test, clippy,
  fmt, cross build), CI workflow updated for the bundle, docs describe the
  bundle flow, run-dev smoke

out_of_scope:
- >-
  Embedding assets in the binary — user decision (spike proved it works;
  blurs what ships where). See specs/archive/spikes/SPIKE-e05-update-bundle.md
- >-
  KUAL menu extension — dropped, scriptlet-only launch (user decision)
- >-
  In-app update of scriptlet/kindlichess.sh — user decision; it stays the
  stable entry point
- >-
  litchee migration, new game features (rated/variants/rematch/lobby),
  multi-device layouts — separate initiatives
- >-
  Physical on-device UAT of a real release beyond the spike probe — manual,
  needs the k2 on the LAN
- >-
  Rewriting historical artifacts (specs/epics/, CHANGELOG.md) — they keep
  point-in-time path names

constraints:
- >-
  Rust + x11rb; static musl armv7-unknown-linux-musleabi cross build stays
  green; CI runs fmt + clippy -D warnings + test + cross build + coverage
- >-
  Device facts (spike-proven 2026-11-10): armv7l, /mnt/us fuse.fsp rw, busybox
  tar 1.34.1 + gzip + sha256sum work on /mnt/us, ~3.1 GB free, dirs
  bin/assets/log/secrets/config exist and are writable
- >-
  1072x1448 canvas and existing screens unchanged; update UX fits UpdateScreen
- >-
  No new runtime dependencies; device tar/sha256/df are invoked from the
  launcher script / via std::process, not linked in
- >-
  Legacy release assets (kindle-chess-armv7-musl{,.sha256}) stay during
  transition so 0.4.0 clients can still update
- >-
  Shell scripts stay POSIX sh (sh -n clean)

success_criteria:
- >-
  cargo build (dev + armv7 cross) + cargo test + clippy -D warnings + fmt
  --check all green
- >-
  release.yml dry run produces update.tar.gz + .sha256; bundle MANIFEST
  verifies against extracted contents
- >-
  App preflight blocks wrong arch / missing dir / low space with a readable
  UpdateScreen message (unit tests on the parsers)
- >-
  Staged flow works: .new sidecar + sidecar sha256 + per-file manifest verify
  + trampoline install at next launch; failure leaves the old install intact
  (host-harness test of the trampoline)
- >-
  No kindle_KUAL/hellokindle references outside historical artifacts; sh -n
  clean on all scripts; scriptlet-only launch documented
- >-
  Docs (CLAUDE.md, ARCHITECTURE, ci-cd, tech-stack) match the new layout and
  describe the bundle update flow

trade_offs:
- item: one bundle vs per-file assets
  reason: spike proved device tar works; atomic all-or-nothing install and a single storage check outweigh 3 parallel downloads
- item: no embedding
  reason: user decision — keeps one delivery mechanism, avoids the config/assets split and the +~1.4 MB binary
- item: legacy binary assets kept during transition
  reason: 0.4.0 clients expect exactly those two asset names; drop in a later release
- item: release-please extra-files on kindlichess/
  reason: without it, asset/script changes never trigger a tag; alternative (moving files under crate/) churns paths again

references:
- specs/archive/spikes/SPIKE-e05-update-bundle.md (device probe results)
- specs/planning-context.yaml (elaborate-spec decisions)
- crate/src/api/update.rs, crate/src/api/github.rs, crate/src/ui/screens/update.rs (current updater)
- kindlichess/chess_app.sh (current trampoline)
- .github/workflows/release.yml, release-please-config.json
- scriptlet/kindlichess.sh
