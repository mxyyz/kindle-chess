---
# specs/product/SCOPE_LATEST.yaml — bounded PRD for the current initiative (e04)
# Written by scope-work. Consumed by slice-tasks / plan-work.
# Previous (e03) scope archived at
# specs/epics/e03-target-device-directory-restructure/SCOPE.yaml
feature_name: e04-e01-leftovers (code organization, tests, errors, CI)
core_value: >-
  Make the codebase easier to change safely: smaller screen files, named layout
  values, tests on untested modules, one error type at the API boundary, and
  CI that checks lint, format and coverage.
summary: >-
  e04 finishes the e01 backlog (t05-t13, t15) plus the unfinished part of
  t14. There is no user-visible change: behavior on the device stays the same.

  The screen code is now in two very large files (models/ui.rs ~840 lines,
  ui/screens.rs ~2600 lines). They split into one file per screen. Hard-coded
  pixel values move into one layout module. The game, OAuth, board-API and
  widget modules get tests. Code outside api/ sees one ChessError type in
  place of Box<dyn Error>. CI adds clippy, rustfmt, dependency caching and
  a coverage report.

  The e01 task details predate the litchee migration and e02/e03. Slicing
  must check each against current code (for example, which oauth/board types
  still exist, which tests in kindle_chess/tests/ already cover them).
in_scope:
- >-
  e04-code-org (from e01 t05, t06): one file per screen for the screen structs
  and Screen impls; models/ui.rs and ui/screens.rs become small
- >-
  e04-code-org (from e01 t07): display dimensions and layout magic numbers
  in one layout module
- >-
  e04-tests (from e01 t08-t11): unit tests for game models, OAuth, board API
  and widget logic (hit tests, geometry), skipping cases already covered
- >-
  e04-errors (from e01 t12, t13): ChessError (Send + Sync) returned from api/
  functions; wraps litchee, HTTP, IO and parse errors
- >-
  e04-ci (from e01 t14 rest): rust.yml runs cargo clippy and cargo fmt --check,
  with dependency caching; fix existing clippy/fmt findings so CI is green
- >-
  e04-ci (from e01 t15): coverage report as a CI artifact plus a README badge,
  report only
out_of_scope:
- >-
  Any user-visible behavior or layout change — this is a no-behavior-change
  refactor (e04 is cleanup)
- >-
  ChessError outside the api/ boundary (app/, ui/ internals keep their current
  error handling) — user decision; extend later if useful
- >-
  A coverage threshold that fails CI — user decision: report only; add a gate
  once coverage is meaningful
- >-
  Multi-device layouts / resolutions other than 1072x1448 — layout constants
  only make this possible later
- >-
  X11 rendering tests (pixel output) — need a display; widget tests cover
  pure logic only
- >-
  New features, new screens, new Lichess endpoints — separate epic
constraints:
- >-
  Rust + x11rb; static musl armv7-unknown-linux-musleabi cross build must
  stay green
- >-
  Tests must run headless on the CI runner (no X11, no network, no assets)
- >-
  run-dev.sh harness keeps working; pixel layout identical before and after
- >-
  No new runtime dependencies; a dev-only coverage tool (cargo-llvm-cov or
  tarpaulin) is allowed in CI
success_criteria:
- >-
  models/ui.rs and ui/screens.rs no longer hold per-screen code; each screen
  has its own file
- >-
  No raw 1072/1448/134-style layout numbers outside the layout module (where
  they are layout values)
- >-
  New tests for game, OAuth, board API and widgets; cargo test green
- >-
  api/ public functions return Result<T, ChessError>; callers compile without
  Box<dyn Error> from api/
- >-
  CI on main runs test, clippy (-D warnings), fmt --check, cross build and
  coverage — all green
- README shows a coverage badge
- On-device smoke check after merge: app behaves as in 0.3.0
trade_offs:
- item: ChessError only at api/ boundary
  reason: >-
    smallest change that gives callers one error type; whole-app migration
    has more risk for little gain
- item: coverage report only, no gate
  reason: a threshold on a low baseline only adds CI noise
- item: no rendering tests
  reason: needs an X server in CI; cost greater than value now
references:
- >-
  specs/epics/e01-refactor-and-tests/tasks.yaml (t05-t15 original detail)
- >-
  specs/epics/e01-refactor-and-tests/samples/chess_error_sample.rs
- .github/workflows/rust.yml
- specs/tech-architecture/tech-stack.md
